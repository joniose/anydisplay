name: Windows pairing build

on:
  push:
    branches: [codex/require-network-pairing]

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked
      - run: cargo build --release --locked
      - uses: actions/upload-artifact@v4
        with:
          name: anydisplay-win-x64
          path: windows/target/release/anydisplay-win.exe
          if-no-files-found: error
      - name: Build and smoke-test the Windows launcher
        shell: pwsh
        run: |
          $framework = Join-Path $env:SystemRoot 'Microsoft.NET\Framework64\v4.0.30319'
          $metadata = Join-Path $env:SystemRoot 'System32\WinMetadata'
          $package = (New-Item -Path launcher-package -ItemType Directory -Force).FullName
          $launcher = Join-Path $package 'AnyDisplay-Start.exe'
          $refs = @(
            "$framework\System.Runtime.WindowsRuntime.dll"
            "$framework\System.Runtime.dll"
            "$framework\System.Runtime.InteropServices.WindowsRuntime.dll"
            "$metadata\Windows.Devices.winmd"
            "$metadata\Windows.Foundation.winmd"
            "$metadata\Windows.Security.winmd"
          ) | ForEach-Object { "/reference:$_" }
          & (Join-Path $framework 'csc.exe') /nologo /target:winexe "/out:$launcher" @refs ../tools/AnyDisplay-Start.cs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $test = Start-Process -FilePath $launcher -ArgumentList '--smoke-test' -WindowStyle Hidden -Wait -PassThru
          if ($test.ExitCode -ne 0) { exit $test.ExitCode }
          Copy-Item target/release/anydisplay-win.exe $package
      - uses: actions/upload-artifact@v4
        with:
          name: anydisplay-windows
          path: windows/launcher-package/
          if-no-files-found: error
