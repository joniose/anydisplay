name: Windows pairing build

on:
  push:
    branches: [codex/require-network-pairing]

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked
      - run: cargo build --release --locked
      - uses: actions/upload-artifact@v4
        with:
          name: anydisplay-win-x64
          path: windows/target/release/anydisplay-win.exe
          if-no-files-found: error
      - name: Build and smoke-test the Windows launcher
        shell: pwsh
        run: |
          $framework = Join-Path $env:SystemRoot 'Microsoft.NET\Framework64\v4.0.30319'
          $metadata = Join-Path $env:SystemRoot 'System32\WinMetadata'
          $package = (New-Item -Path launcher-package -ItemType Directory -Force).FullName
          $launcher = Join-Path $package 'AnyDisplay-Start.exe'
          $refs = @(
            "$framework\System.Runtime.WindowsRuntime.dll"
            "$framework\System.Runtime.dll"
            "$framework\System.Runtime.InteropServices.WindowsRuntime.dll"
            "$metadata\Windows.Devices.winmd"
            "$metadata\Windows.Foundation.winmd"
            "$metadata\Windows.Security.winmd"
            "$metadata\Windows.Storage.winmd"
          ) | ForEach-Object { "/reference:$_" }
          $bluetooth = (Resolve-Path -LiteralPath '..\tools\AnyDisplay-Ble.cs').ProviderPath
          $source = (Resolve-Path -LiteralPath '..\tools\AnyDisplay-Start.cs').ProviderPath
          $icon = (Resolve-Path -LiteralPath '..\tools\AnyDisplay.ico').ProviderPath
          $stampFile = Join-Path $env:RUNNER_TEMP 'anydisplay-build-time.txt'
          $buildTime = [TimeZoneInfo]::ConvertTimeBySystemTimeZoneId([DateTimeOffset]::UtcNow, 'W. Europe Standard Time')
          [IO.File]::WriteAllText($stampFile, $buildTime.ToString('yyyyMMdd-HHmm', [Globalization.CultureInfo]::InvariantCulture))
          & (Join-Path $framework 'csc.exe') /nologo /target:winexe "/out:$launcher" "/win32icon:$icon" "/resource:$icon,AnyDisplay.ico" "/resource:$stampFile,AnyDisplay.BuildTime" /reference:System.Web.Extensions.dll @refs $source $bluetooth
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $test = Start-Process -FilePath $launcher -ArgumentList '--smoke-test' -WindowStyle Hidden -Wait -PassThru
          if ($test.ExitCode -ne 0) { exit $test.ExitCode }
          Copy-Item target/release/anydisplay-win.exe $package
      - uses: actions/upload-artifact@v4
        with:
          name: anydisplay-windows
          path: windows/launcher-package/
          if-no-files-found: error

  android:
    name: Android BLE client
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - run: bash ./gradlew testDebugUnitTest lintDebug assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: anydisplay-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
